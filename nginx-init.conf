# Temporary HTTP-only config used during initial certificate provisioning.
# Once Certbot has issued certs, the container restarts with the full nginx.conf.
server {
    listen 80;
    server_name vendiqtech.com www.vendiqtech.com;
    root /usr/share/nginx/html;
    index index.html;

    # Let Certbot verify domain ownership
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API reverse proxy
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /beta {
        try_files $uri $uri/ /beta/index.html;
    }
}
