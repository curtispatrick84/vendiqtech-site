    M 47,25
    C 48,33 53,34 56,35
    C 53,36 48,37 47,45
    C 46,37 41,36 38,35
    C 41,34 46,33 47,25 Z
  "/>
  <!-- Small sparkle (upper-right, inside inner iris circle) -->
  <path d="
    M 56,26
    C 56.5,28.5 59,29 60.5,29.5
    C 59,30 56.5,30.5 56,33
    C 55.5,30.5 53,30 51.5,29.5
    C 53,29 55.5,28.5 56,26 Z
  "/>
</svg>
