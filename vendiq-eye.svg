    M 3,35 Q 50,-3 97,35 Q 50,73 3,35 Z
    M 19,35 Q 50,13 81,35 Q 50,57 19,35 Z
  "/>
  <!-- Iris ring (outer circle minus inner cutout) -->
  <path fill-rule="evenodd" d="
    M 50,17 A 18,18 0 1,1 50,53 A 18,18 0 1,1 50,17 Z
    M 50,23 A 12,12 0 1,1 50,47 A 12,12 0 1,1 50,23 Z
  "/>
  <!-- Large sparkle (contained within inner iris circle) -->
